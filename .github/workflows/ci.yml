name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer lint

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer analyze -- --no-progress --error-format=github

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer test

  integration:
    name: Integration tests (PHP ${{ matrix.php }}, 3 order storages)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: npm ci
      - run: npm run env:start
      - run: npm run build
      - name: Integration tests on HPOS, posts storage and sync mode
        run: npm run test:php:integration:storage

  integration-min:
    name: Integration tests (minimum versions, WP 6.7 + WC 10.0.0, PHP 8.1, 3 order storages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: npm ci
      - run: npm run env:start:min
      - run: npm run build
      - name: Integration tests on HPOS, posts storage and sync mode
        run: npm run test:php:integration:storage:min

  js:
    name: JS lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run build

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: npm ci
      - name: Build distributable zip
        run: npm run zip
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/costa-rica-checkout-for-woocommerce
          slug: costa-rica-checkout-for-woocommerce
      - uses: actions/upload-artifact@v7
        with:
          name: costa-rica-checkout-for-woocommerce
          path: dist/*.zip
          if-no-files-found: error
